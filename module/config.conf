# OPlus DDRC Control configuration
#
# MODE=stock     no override, the OEM DDRC policy is left untouched
# MODE=balanced  GAUGE_TERM_VOLTAGE=3150 / GAUGE_SHUTDOWN_VOLTAGE=3100 (default)
# MODE=full      GAUGE_TERM_VOLTAGE=3040 / GAUGE_SHUTDOWN_VOLTAGE=3000 (experimental)
#
# Read once per boot by service.sh. The Action button rewrites the MODE line.
# Any unrecognised value is treated as stock.

MODE=balanced
