name: ci

# Static verification only. This project needs no secrets, no deploy keys and
# no tokens: the workflow checks shell syntax, runs the static audit, runs the
# privacy scan, runs the regression suite and rebuilds the module ZIP.
#
# The module itself is never executed here -- it targets an Android device and
# is not runnable on a CI runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show environment
        run: |
          uname -a
          bash --version | head -1
          ls -l /bin/sh

      - name: Shell syntax check (device-side scripts, POSIX sh)
        run: |
          set -e
          # These run on the device under the KernelSU ash shell, so they are
          # checked with a strictly POSIX shell (dash on the runner).
          for f in module/*.sh scripts/device-safe-probe.sh \
                   scripts/device-readonly-audit.sh scripts/device-dt-dump.sh; do
            printf '%s: ' "$f"
            sh -n "$f"
            echo ok
          done
          echo "syntax (device-side): PASS"

      - name: Shell syntax check (host-side tooling, bash)
        run: |
          set -e
          # These are PC-side tools invoked with `bash`; they are not shipped to
          # the device and are second-class to the module payload, but they must
          # still parse cleanly under bash.
          for f in scripts/audit.sh scripts/build.sh scripts/privacy-scan.sh \
                   scripts/host-probe.sh scripts/decode-dt.sh tests/*.sh; do
            printf '%s: ' "$f"
            bash -n "$f"
            echo ok
          done
          echo "syntax (host-side): PASS"

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck zip unzip

      - name: Shellcheck (device-side scripts, POSIX sh)
        run: |
          set -e
          # Only these run on the device under the KernelSU ash shell, so only
          # these must stay POSIX. The host-side tooling below is bash.
          shellcheck -s sh -S warning \
            module/*.sh \
            scripts/device-safe-probe.sh \
            scripts/device-readonly-audit.sh \
            scripts/device-dt-dump.sh
          echo "shellcheck (device-side): PASS"

      - name: Shellcheck (host-side tooling, bash)
        run: |
          set -e
          shellcheck -S warning -e SC1090,SC1091 \
            scripts/audit.sh \
            scripts/build.sh \
            scripts/privacy-scan.sh \
            scripts/host-probe.sh \
            scripts/decode-dt.sh \
            tests/*.sh
          echo "shellcheck (host-side): PASS"

      - name: Regression suite
        run: bash tests/run-all.sh

      - name: Static safety audit
        run: bash scripts/audit.sh

      - name: Privacy scan
        run: bash scripts/privacy-scan.sh

      - name: Verify the committed artifact matches its published hash
        run: |
          set -e
          # This is checked BEFORE building anything. Rebuilding and then hashing
          # the rebuild would only prove the build is self-consistent; what a
          # user downloading the release actually depends on is that the ZIP
          # checked into dist/ is the one SHA256SUMS describes.
          (cd dist && sha256sum -c SHA256SUMS)
          echo "committed artifact: matches SHA256SUMS"

      - name: Build module ZIP
        run: bash scripts/build.sh

      - name: Verify ZIP contents and SHA256SUMS
        run: |
          set -e
          zipfile="$(ls dist/OPlus-DDRC-Control-*.zip)"
          echo "artifact: $zipfile"

          # Every expected entry must be present, at the ZIP root.
          expected="module.prop customize.sh service.sh uninstall.sh action.sh common.sh config.conf skip_mount"
          for name in $expected; do
            if ! unzip -l "$zipfile" | awk '{print $4}' | grep -qx "$name"; then
              echo "FAIL: $name missing from ZIP root"
              exit 1
            fi
          done
          echo "zip entries: all present at root"

          # No extra directory level, and nothing that must not ship.
          if unzip -l "$zipfile" | awk '{print $4}' | grep -qE '^(OPlus-DDRC-Control|module)/'; then
            echo "FAIL: ZIP contains an unexpected wrapper directory"
            exit 1
          fi
          bad="$(unzip -l "$zipfile" | awk '{print $4}' |
            grep -E '\.(img|dtbo|bin|ko)$|^system/|^vendor/|^product/|^odm/|^system_ext/|^my_product/' || true)"
          if [ -n "$bad" ]; then
            echo "FAIL: forbidden entry in ZIP: $bad"
            exit 1
          fi
          echo "zip contents: clean"

          # SHA256SUMS records bare file names, so it must be checked from
          # inside dist/.
          (cd dist && sha256sum -c SHA256SUMS)
          echo "sha256: PASS"

      - name: Confirm a rebuild reproduces the committed artifact
        run: |
          set -e
          # build.sh pins entry timestamps, so the archive bytes depend only on
          # the module payload. A rebuild that differs means the checked-in ZIP
          # no longer describes the sources next to it.
          if ! git diff --quiet -- dist/; then
            echo "FAIL: building produced a different artifact than the one committed"
            git --no-pager diff --stat -- dist/
            exit 1
          fi
          echo "rebuild reproducibility: PASS"

      - name: Confirm no device tree or partition artifact exists in the repo
        run: |
          set -e
          if git ls-files | grep -E '\.(img|dtbo|bin|ko)$'; then
            echo "FAIL: binary partition artifact is tracked"
            exit 1
          fi
          echo "tracked artifacts: clean"
